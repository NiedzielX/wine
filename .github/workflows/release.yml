# DRAFT (lesson 22, docs/RELEASING.md section 5). Manual only; NOT a required check; has never run yet.
#
# What it does, on `main` only, for a version the owner already prepared in a merged PR (package.json versions set with
# `npm run release:version -- --set X.Y.Z --write`, CHANGELOG.md and UPGRADE_NOTES.md promoted with
# `npm run release:notes -- promote X.Y.Z --write`):
#   verify   the dispatched ref is main; the input is X.Y.Z; every package.json and package-lock.json carry X.Y.Z;
#            CHANGELOG.md has a non-empty [X.Y.Z] section; the CI checks of this exact commit, reported by the GitHub
#            Actions app (app_id 15368, so no other app can post a green "lint"), are green: lint, secrets, design,
#            unit, a11y, build, database, e2e, image. This list is deliberately STRICTER than branch protection
#            (which requires six of them): a release needs the built image and the UI checks too (docs/RELEASING.md §6).
#   release  runs in the GitHub environment `release` and creates the GitHub Release `vX.Y.Z` at this commit with the
#            notes from CHANGELOG.md and UPGRADE_NOTES.md, as a DRAFT by default (the tag appears only when the owner
#            presses "Publish release"); `publish: true` publishes at once and GitHub creates the tag.
#            Idempotent: a release for vX.Y.Z at this commit is reported and left alone. It FAILS on a draft or tag for
#            vX.Y.Z at another commit (a stale draft from an earlier dispatch: delete it; a tag: tags never move,
#            docs/DEPLOYMENT.md 10.1) and on any API error other than 404 (no error is read as "the tag is missing").
#
# The main-only guard below is in this file, so anyone with write access could dispatch a branch whose copy of the file
# drops it. The server-side guard is the environment `release`: the owner creates it (Settings -> Environments) with
# "Deployment branches and tags: Selected -> main" and, optionally, himself as required reviewer. Until then GitHub
# creates the environment on first use WITHOUT protection (the job does not hang; the guard is then only this file).
# With a required reviewer the job waits for approval (GitHub expires an unanswered one after 30 days).
# What it does NOT do: publish packages (every package is private, nothing goes to npm), build or push an image,
# deploy, change files or push commits. The release decision stays with the owner.
#
# Supply chain (lesson 18): actions pinned by full SHA, the same pins as ci.yml; checkouts keep no token
# (persist-credentials: false). The tag and the release are created through the REST API by `gh release create`
# with GITHUB_TOKEN, which is given only to the steps that need it, so no git credential is ever written to disk and
# no `git push` is needed. Only the `release` job has `contents: write`.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z (no leading v), already set in package.json and promoted in CHANGELOG.md on main'
        required: true
        type: string
      publish:
        description: 'Publish now (creates the tag). Default: a draft release the owner publishes by hand'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read     # read the CI results of this commit; nothing else
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse any ref other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release runs only from refs/heads/main, not $GITHUB_REF"
          exit 1
      - name: The version is X.Y.Z (the input reaches the shell only through an environment variable)
        run: |
          printf '%s' "$VERSION" | grep -Eqx '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' || { echo "::error::version must be X.Y.Z without a leading v"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # both scripts have no dependencies: no npm ci, no third-party code in this workflow
      - name: Every package.json and package-lock.json carry the version
        run: node scripts/release-version.mjs --check --expect "$VERSION"
      - name: CHANGELOG.md has the version section and UPGRADE_NOTES.md is complete
        run: node scripts/release-notes.mjs render "$VERSION" --out "$RUNNER_TEMP/release-notes.md"
      - name: CI checks of this commit are green (stricter than branch protection, see the header)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          # app_id 15368 = GitHub Actions: a check run with the same name posted by any other app does not count
          for name in lint secrets design unit a11y build database e2e image; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$name&filter=latest&app_id=15368" --jq '[.check_runs[].conclusion] | first // "missing"')"
            echo "$name: $conclusion"
            test "$conclusion" = success || failed=1
          done
          test "$failed" = 0 || { echo "::error::a required CI check of $GITHUB_SHA is not green; wait for CI on main or fix it first"; exit 1; }

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Server-side guard (see the header): the owner restricts this environment to `main`. If it does not exist yet,
    # GitHub creates it unprotected on first use, so the job runs instead of hanging.
    environment: release
    permissions:
      contents: write  # create the tag and the release through the API; the only write permission in this workflow
    env:
      VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - name: Refuse any ref other than main (again; this job holds the write token)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release runs only from refs/heads/main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Render the release notes (same deterministic script as in verify)
        run: node scripts/release-notes.mjs render "$VERSION" --out "$RUNNER_TEMP/release-notes.md"
      - name: Create the release (draft unless publish is true); leave one at this commit alone, fail on any other
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          err="$RUNNER_TEMP/gh-error.txt"
          # Commit of the tag, empty when GitHub answers 404. Any other failure (403, 5xx, rate limit) stops the run:
          # it must never be read as "the tag does not exist".
          tag_commit() {
            if ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>"$err")"; then
              type="${ref%% *}"; sha="${ref#* }"
              if [ "$type" = tag ]; then sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha')"; fi
              printf '%s' "$sha"
            elif grep -q '(HTTP 404)' "$err"; then
              printf ''
            else
              echo "::error::looking up tag $tag failed (not a 404): $(head -c 300 "$err")" >&2
              return 1
            fi
          }
          commit="$(tag_commit)" || exit 1
          if [ -n "$commit" ] && [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::tag $tag already points to $commit, not $GITHUB_SHA; tags never move (docs/DEPLOYMENT.md 10.1)"
            exit 1
          fi
          # releases, drafts included (a draft has no tag yet): draft flag, target, address
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | [(.draft | tostring), .target_commitish, .html_url] | @tsv")"
          if [ -n "$existing" ]; then
            if [ "$(printf '%s\n' "$existing" | wc -l)" -gt 1 ]; then
              echo "::error::several releases are named $tag (drafts can share a tag name); delete the extra drafts and run again"
              exit 1
            fi
            draft="$(printf '%s' "$existing" | cut -f1)"; target="$(printf '%s' "$existing" | cut -f2)"; url="$(printf '%s' "$existing" | cut -f3)"
            if [ "$draft" = true ] && [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::a draft release $tag from an earlier run targets $target, not $GITHUB_SHA: it is stale. Delete it ($url) and run again"
              exit 1
            fi
            if [ "$draft" != true ] && [ -z "$commit" ]; then
              echo "::error::release $tag is published but its tag is missing; the owner must look at $url"
              exit 1
            fi
            echo "::notice::release $tag already exists at this commit ($url, draft: $draft); nothing changed"
            exit 0
          fi
          if [ -n "$commit" ]; then echo "tag $tag exists at this commit; creating only the release"; fi
          set -- "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Wine Match $tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          if [ "$PUBLISH" != true ]; then set -- "$@" --draft; fi
          gh release create "$@"
          echo "::notice::release $tag created ($( [ "$PUBLISH" = true ] && echo published || echo 'draft: publish it in the Releases page to create the tag' ))"
