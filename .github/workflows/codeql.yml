# CodeQL (lesson 14): deterministic static analysis of the TypeScript code for security problems, as an extra check
# on every pull request. The repository is public, so it is free. It follows data flow from request input to
# dangerous places (SQL, paths, HTML), which an agent reading one file can miss. The result appears as a check and as
# annotations on the pull request; whether it BLOCKS a merge is a branch protection rule (a repository setting that
# the maintainer sets: add "CodeQL / analyze" to the required checks once the first runs are clean).
# `security-extended` (added 2026-11-07, lesson 16 / docs/security/threat-model.md): the broader query suite, on top
# of the default one — more coverage (e.g. more injection and crypto patterns), more false positives. A new alert it
# raises is reported and reviewed, never mass-suppressed; a genuine false positive gets a dismissal with a reason on
# the specific alert, not a change to this file.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
