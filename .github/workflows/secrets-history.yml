# Secret scan of the whole git history (lesson 18): the lines added by every commit of every branch and tag, with the
# same patterns and allowlists as the per-pull-request scan (scripts/secret-scan.mjs --history). Weekly and on demand;
# NOT a required check, because a finding here means "rotate", which is a decision for the owner, not a red pull request.
# The log shows commit, path, pattern and a hash prefix of the value, never the value.
name: Secrets history

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Secret scan of the full history (values are never printed)
        run: npm run secrets:scan:history
